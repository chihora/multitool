[project]
name = "multitool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soughtout", email = "soughtoutresources@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mt = "multitool:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
